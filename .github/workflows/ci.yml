name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

    # Your unit-tests steps will go here
      - name: Restore dependencies
        run: dotnet restore
        
      - name: Build the project
        run: dotnet build --no-restore
        
      - name: Run unit tests
        run: dotnet test --configuration Release --verbosity normal


coverage:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
      uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

    # Your coverage steps will go here
      - name: Restore dependencies
        run: dotnet restore
      
      - name: Run coverage tests
        run: dotnet test --configuration Release p:CollectCoverage=true p:CoverletOutputFormat=opencover p:Threshold=97 p:ThresholdType=line '/p:Include="[Howestprime.Movies.Application]*,[Howestprime.Movies.Domain]*"'
